name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desk/package-lock.json

      - name: Install
        working-directory: desk
        run: npm ci

      - name: Test
        working-directory: desk
        run: npm test

      - name: Build
        working-directory: desk
        run: npm run build

      # Root stays the original Operator Protocol app; the journal lives at /desk/.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html journal.html _site/
          cp -r desk/dist _site/desk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
